<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>브레인 업 - 부모님 관리 현황</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #3b82f6;
      --accent-light: #eff6ff;
      --good: #10b981;
      --good-light: #d1fae5;
      --warn: #f59e0b;
      --warn-light: #fef3c7;
      --danger: #ef4444;
      --danger-light: #fee2e2;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
      min-height: 100vh;
      color: var(--text);
    }
    
    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      min-height: 100vh;
    }
    
    .header {
      text-align: center;
      padding: 20px 0 24px;
    }
    
    .logo {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
    }
    
    .loading {
      text-align: center;
      padding: 60px 20px;
    }
    
    .loading i {
      font-size: 48px;
      color: var(--accent);
      animation: spin 1s linear infinite;
    }
    
    .loading p {
      margin-top: 16px;
      color: var(--muted);
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    @keyframes fireGlow {
      0%, 100% { 
        filter: drop-shadow(0 0 2px rgba(234,88,12,0.4));
        transform: scale(1);
      }
      50% { 
        filter: drop-shadow(0 0 6px rgba(234,88,12,0.6));
        transform: scale(1.1);
      }
    }
    
    .error-card {
      background: var(--card);
      border-radius: 24px;
      padding: 48px 28px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    
    .error-icon { 
      font-size: 56px; 
      color: var(--muted); 
      margin-bottom: 20px;
      opacity: 0.6;
    }
    
    .error-title { 
      font-size: 20px; 
      font-weight: 800; 
      color: var(--text); 
      margin-bottom: 10px; 
    }
    
    .error-desc { 
      font-size: 15px; 
      color: var(--muted); 
      line-height: 1.7; 
    }
    
    /* 프로필 카드 */
    .profile-card {
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    
    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    
    .profile-avatar i {
      font-size: 32px;
      color: white;
    }
    
    .profile-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }
    
    .profile-info {
      font-size: 14px;
      color: var(--muted);
    }
    
    /* 상태 배지 */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 16px;
    }
    
    .status-badge.good {
      background: var(--good-light);
      color: #059669;
    }
    
    .status-badge.warn {
      background: var(--warn-light);
      color: #b45309;
    }
    
    .status-badge.danger {
      background: var(--danger-light);
      color: #dc2626;
    }
    
    /* 액션 섹션 */
    .action-card {
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    
    .action-message {
      font-size: 15px;
      color: var(--text);
      line-height: 1.7;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .action-btn {
      width: 100%;
      padding: 16px 24px;
      background: var(--accent);
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    
    .action-btn:hover {
      opacity: 0.9;
    }
    
    .action-btn.warn { background: var(--warn); }
    .action-btn.danger { background: var(--danger); }
    
    .action-hint {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-top: 14px;
    }
    
    /* 메모 표시 */
    .memo-display {
      background: var(--accent-light);
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    
    .memo-display-label {
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .memo-display-text {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
    }
    
    .link-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      font-weight: 600;
    }
    
    .link-btn:hover {
      text-decoration: underline;
    }
    
    /* 통계 카드 */
    .stats-card {
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    
    .stats-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    
    .stat-item {
      text-align: center;
      padding: 16px 8px;
      background: var(--bg);
      border-radius: 16px;
    }
    
    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
    }
    
    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    
    /* 주간 카드 */
    .week-card {
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    
    .week-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    
    .week-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    
    .week-count {
      font-size: 14px;
      color: var(--accent);
      font-weight: 600;
      background: var(--accent-light);
      padding: 4px 12px;
      border-radius: 20px;
    }
    
    /* 주 네비게이션 */
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    
    .week-nav-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--bg);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: all 0.2s ease;
    }
    
    .week-nav-btn:hover:not(:disabled) {
      background: var(--accent-light);
      color: var(--accent);
    }
    
    .week-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    
    .week-nav-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      min-width: 140px;
      text-align: center;
    }
    
    .this-week-badge {
      display: inline-block;
      font-size: 11px;
      background: var(--accent);
      color: white;
      padding: 3px 10px;
      border-radius: 10px;
      margin-top: 6px;
    }
    
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    
    .week-day {
      text-align: center;
    }
    
    .week-day-name {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    .week-day-cell {
      width: 36px;
      height: 36px;
      margin: 0 auto;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .week-day-cell:hover {
      transform: scale(1.1);
    }
    
    .week-day-cell.done {
      background: var(--good-light);
      color: var(--good);
    }
    
    .week-day-cell.missed {
      background: var(--warn-light);
      color: #b45309;
    }
    
    .week-day-cell.future {
      background: var(--bg);
      color: var(--muted);
    }
    
    .week-day-cell.today {
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    
    .streak-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--text);
      font-weight: 600;
    }
    
    .streak-info i {
      color: #ea580c;
      animation: fireGlow 1.5s ease infinite;
    }
    
    /* 상태 카드 */
    .status-card {
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    
    .status-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: 12px;
    }
    
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    
    .status-item-label {
      flex: 1;
      font-size: 14px;
      color: var(--text);
    }
    
    .status-item-value {
      font-size: 14px;
      font-weight: 600;
    }
    
    /* 최근 활동 */
    .activity-card {
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    
    .activity-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .activity-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--bg);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .activity-item:hover {
      background: var(--border);
    }
    
    .activity-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    
    .activity-icon.pattern {
      background: #fef3c7;
      color: #f59e0b;
    }
    
    .activity-icon.gonogo {
      background: #dbeafe;
      color: #3b82f6;
    }
    
    .activity-icon.digit {
      background: #d1fae5;
      color: #10b981;
    }
    
    .activity-icon.training {
      background: #fce7f3;
      color: #db2777;
    }
    
    .activity-info {
      flex: 1;
    }
    
    .activity-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    
    .activity-date {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    
    .activity-score {
      font-size: 14px;
      font-weight: 700;
      color: var(--good);
    }
    
    .empty-activity {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 14px;
    }
    
    /* 안내 카드 */
    .info-card {
      background: var(--accent-light);
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    
    .info-card p {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
    }
    
    .info-card i {
      color: var(--accent);
      margin-right: 8px;
    }
    
    /* 자녀 확인 중 */
    .watching-card {
      background: #f0fdf4;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    
    .watching-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    
    .watching-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--good);
      animation: pulse 2s infinite;
    }
    
    .watching-label {
      font-size: 13px;
      color: #15803d;
      font-weight: 600;
    }
    
    .watching-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }
    
    /* 푸터 */
    .footer {
      text-align: center;
      padding: 24px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    
    /* 링크 복사 버튼 */
    .copy-link-btn {
      width: 100%;
      padding: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    
    .copy-link-btn:hover {
      background: var(--border);
    }
    
    /* 모달 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,23,42,0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    
    .modal-content {
      background: var(--card);
      border-radius: 24px;
      padding: 28px;
      max-width: 360px;
      width: 100%;
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }
    
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }
    
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 20px;
      text-align: center;
    }
    
    .modal-text {
      font-size: 15px;
      color: var(--text);
      line-height: 1.6;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .modal-date {
      font-size: 14px;
      color: var(--accent);
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
    }
    
    .memo-textarea {
      width: 100%;
      height: 140px;
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 16px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      margin-bottom: 20px;
    }
    
    .memo-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .modal-btns {
      display: flex;
      gap: 12px;
    }
    
    .modal-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .modal-btn:hover {
      transform: translateY(-2px);
    }
    
    .modal-btn.cancel {
      background: var(--bg);
      color: var(--muted);
    }
    
    .modal-btn.primary {
      background: var(--accent);
      color: white;
    }
    
    .modal-close {
      width: 100%;
      padding: 14px;
      background: var(--bg);
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }
    
    /* 메모 히스토리 */
    .memo-history-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    
    .memo-history-item:last-child {
      border-bottom: none;
    }
    
    .memo-history-content {
      flex: 1;
    }
    
    .memo-history-date {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    
    .memo-history-text {
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
      white-space: pre-wrap;
    }
    
    .memo-delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }
    
    .memo-delete-btn:hover {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">브레인 업</div>
    </header>
    
    <main id="app">
      <div class="loading">
        <i class="fa-solid fa-spinner"></i>
        <p>불러오는 중...</p>
      </div>
    </main>
    
    <footer class="footer">
      부모님의 뇌 건강을 함께 지켜봐요<br/>
      브레인 업 · 가족 케어
    </footer>
  </div>
  
  <!-- 메모 모달 -->
  <div class="modal-overlay" id="memoModal">
    <div class="modal-content">
      <div class="modal-title" id="memoModalTitle">📝 관찰 메모</div>
      <textarea class="memo-textarea" id="memoText" placeholder="부모님 상태에 대해 메모해두세요."></textarea>
      <div class="modal-btns">
        <button class="modal-btn cancel" id="memoCancel">취소</button>
        <button class="modal-btn primary" id="memoSave">저장</button>
      </div>
    </div>
  </div>
  
  <!-- 날짜 모달 -->
  <div class="modal-overlay" id="dayModal">
    <div class="modal-content">
      <div class="modal-date" id="dayModalDate"></div>
      <div class="modal-text" id="dayModalText"></div>
      <button class="modal-close" id="dayModalClose">확인</button>
    </div>
  </div>
  
  <!-- 활동 상세 모달 -->
  <div class="modal-overlay" id="activityModal">
    <div class="modal-content">
      <div class="modal-title" id="activityModalTitle"></div>
      <div id="activityModalContent"></div>
      <button class="modal-close" id="activityModalClose">확인</button>
    </div>
  </div>
  
  <!-- 메모 히스토리 모달 -->
  <div class="modal-overlay" id="memoHistoryModal">
    <div class="modal-content" style="max-height:80vh;overflow-y:auto;">
      <div class="modal-title">📝 이전 메모 기록</div>
      <div id="memoHistoryList"></div>
      <button class="modal-close" id="memoHistoryClose" style="margin-top:16px;">닫기</button>
    </div>
  </div>
  
  <script>
    const API_URL = 'https://brainup-api.stardog0705.workers.dev';
    const MEMO_KEY = 'guardian_memo_v2';
    const app = document.getElementById('app');
    
    let guardianData = null;
    let selectedWeekOffset = 0;
    
    // URL에서 토큰 가져오기
    function getTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }
    
    // 날짜 포맷 (UTC를 한국 시간으로 변환)
    function formatDate(dateStr) {
      const utcDate = new Date(dateStr + 'Z'); // UTC로 파싱
      const koreaDate = new Date(utcDate.getTime() + (9 * 60 * 60 * 1000));
      const month = koreaDate.getUTCMonth() + 1;
      const day = koreaDate.getUTCDate();
      const hours = koreaDate.getUTCHours();
      const mins = String(koreaDate.getUTCMinutes()).padStart(2, '0');
      return `${month}월 ${day}일 ${hours}:${mins}`;
    }
    
    function formatDateShort(dateStr) {
      const d = new Date(dateStr);
      return `${d.getMonth() + 1}월 ${d.getDate()}일`;
    }
    
    // 오늘 날짜 키 (로컬 시간 기준)
    function getDateKey(date) {
      if (!date) date = new Date();
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    
    // 특정 주 날짜들
    function getWeekDates(offset = 0) {
      const today = new Date();
      const dayOfWeek = today.getDay();
      const sunday = new Date(today);
      sunday.setDate(today.getDate() - dayOfWeek + (offset * 7));
      
      const dates = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(sunday);
        d.setDate(sunday.getDate() + i);
        dates.push(getDateKey(d));
      }
      return dates;
    }
    
    // 주 라벨
    function getWeekLabel(offset) {
      const dates = getWeekDates(offset);
      const start = new Date(dates[0]);
      const end = new Date(dates[6]);
      
      if (start.getMonth() === end.getMonth()) {
        return `${start.getMonth() + 1}월 ${start.getDate()}일 ~ ${end.getDate()}일`;
      }
      return `${start.getMonth() + 1}월 ${start.getDate()}일 ~ ${end.getMonth() + 1}월 ${end.getDate()}일`;
    }
    
    // 검사 타입 이름
    function getTestName(type) {
      const names = {
        'pattern': '패턴 기억력',
        'gonogo': '반응 억제력', 
        'digitspan': '숫자 기억력',
        'training': '일일 관리'
      };
      return names[type] || type;
    }
    
    // 검사 타입 아이콘
    function getTestIconClass(type) {
      if (type === 'pattern') return 'pattern';
      if (type === 'gonogo') return 'gonogo';
      if (type === 'training') return 'training';
      return 'digit';
    }
    
    function getTestIcon(type) {
      const icons = {
        'pattern': 'fa-th',
        'gonogo': 'fa-hand',
        'digitspan': 'fa-calculator',
        'training': 'fa-brain'
      };
      return icons[type] || 'fa-clipboard-check';
    }
    
    // 상태 계산
    function getStatus(stats) {
      if (stats.thisWeekCount === 0) {
        return { class: 'danger', text: '🔴 확인 필요', desc: '이번 주 아직 참여 기록이 없어요' };
      }
      if (stats.thisWeekCount < stats.lastWeekCount - 2) {
        return { class: 'warn', text: '🟡 주의', desc: '지난주보다 참여가 줄었어요' };
      }
      if (stats.thisWeekCount >= 3) {
        return { class: 'good', text: '🟢 안정', desc: '꾸준히 참여하고 계세요' };
      }
      return { class: 'good', text: '🟢 양호', desc: '참여하고 계세요' };
    }
    
    function getActionMessage(status) {
      if (status.class === 'good') {
        return '이번 주는 안심해도 괜찮아요.<br/>특이사항이 있으면 메모해두세요.';
      }
      if (status.class === 'warn') {
        return '참여 빈도에 기복이 보여요.<br/>관찰 내용을 기록해두세요.';
      }
      return '직접 확인이 필요한 신호가 있어요.<br/>안부 전화를 드려보세요.';
    }
    
    // 메모 관련
    function loadMemos(token) {
      try {
        const memos = JSON.parse(localStorage.getItem(MEMO_KEY) || '{}');
        return memos[token] || [];
      } catch {
        return [];
      }
    }
    
    function saveMemo(token, text) {
      try {
        const memos = JSON.parse(localStorage.getItem(MEMO_KEY) || '{}');
        if (!memos[token]) memos[token] = [];
        memos[token].push({ text, date: Date.now() });
        localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
      } catch {}
    }
    
    function deleteMemo(token, index) {
      try {
        const memos = JSON.parse(localStorage.getItem(MEMO_KEY) || '{}');
        if (memos[token]) {
          memos[token].splice(index, 1);
          localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
        }
      } catch {}
    }
    
    function updateMemo(token, index, text) {
      try {
        const memos = JSON.parse(localStorage.getItem(MEMO_KEY) || '{}');
        if (memos[token] && memos[token][index]) {
          memos[token][index].text = text;
          memos[token][index].date = Date.now();
          localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
        }
      } catch {}
    }
    
    let editingMemoIndex = null;
    
    function openEditMemoModal(index, text) {
      editingMemoIndex = index;
      document.getElementById('memoText').value = text;
      document.getElementById('memoModalTitle').textContent = '📝 메모 수정';
      document.getElementById('memoModal').classList.add('active');
    }
    
    function getLatestMemo(token) {
      const memos = loadMemos(token);
      return memos.length > 0 ? memos[memos.length - 1] : null;
    }
    
    // 주간 상태 계산
    function getWeeklyStatus(results, offset) {
      const weekDates = getWeekDates(offset);
      const weekStart = new Date(weekDates[0]);
      const weekEnd = new Date(weekDates[6]);
      weekEnd.setHours(23, 59, 59, 999);
      
      const weekResults = results.filter(r => {
        const d = new Date(r.date);
        return d >= weekStart && d <= weekEnd;
      });
      
      // 처리속도 (pattern)
      const patternResults = weekResults.filter(r => r.testType === 'pattern');
      let speedStatus = { label: '데이터 없음', color: 'var(--muted)' };
      if (patternResults.length > 0) {
        const avgAcc = patternResults.reduce((sum, r) => sum + (r.summary?.accuracy || 0), 0) / patternResults.length;
        if (avgAcc >= 0.85) speedStatus = { label: '안정적', color: 'var(--good)' };
        else if (avgAcc >= 0.7) speedStatus = { label: '양호', color: 'var(--good)' };
        else speedStatus = { label: '변동 있음', color: 'var(--warn)' };
      }
      
      // 주의·억제 (gonogo)
      const gonogoResults = weekResults.filter(r => r.testType === 'gonogo');
      let inhibitStatus = { label: '데이터 없음', color: 'var(--muted)' };
      if (gonogoResults.length > 0) {
        const avgAcc = gonogoResults.reduce((sum, r) => {
          const goAcc = r.summary?.goAcc || 0;
          const nogoAcc = r.summary?.nogoAcc || 0;
          return sum + (goAcc + nogoAcc) / 2;
        }, 0) / gonogoResults.length;
        if (avgAcc >= 0.85) inhibitStatus = { label: '양호', color: 'var(--good)' };
        else if (avgAcc >= 0.7) inhibitStatus = { label: '보통', color: 'var(--good)' };
        else inhibitStatus = { label: '변동 있음', color: 'var(--warn)' };
      }
      
      // 작업기억 (digitspan)
      const digitResults = weekResults.filter(r => r.testType === 'digitspan');
      let workingMemStatus = { label: '데이터 없음', color: 'var(--muted)' };
      if (digitResults.length > 0) {
        const avgSpan = digitResults.reduce((sum, r) => sum + (r.summary?.totalSpan || 0), 0) / digitResults.length;
        if (avgSpan >= 10) workingMemStatus = { label: '유지 중', color: 'var(--good)' };
        else if (avgSpan >= 7) workingMemStatus = { label: '양호', color: 'var(--good)' };
        else if (avgSpan >= 5) workingMemStatus = { label: '보통', color: 'var(--warn)' };
        else workingMemStatus = { label: '변동 있음', color: 'var(--warn)' };
      }
      
      // 공간기억 (spatial)
      const spatialResults = weekResults.filter(r => r.testType === 'spatial');
      let spatialMemStatus = { label: '데이터 없음', color: 'var(--muted)' };
      if (spatialResults.length > 0) {
        const avgSpan = spatialResults.reduce((sum, r) => sum + (r.summary?.maxSpan || 0), 0) / spatialResults.length;
        if (avgSpan >= 7) spatialMemStatus = { label: '유지 중', color: 'var(--good)' };
        else if (avgSpan >= 5) spatialMemStatus = { label: '양호', color: 'var(--good)' };
        else if (avgSpan >= 4) spatialMemStatus = { label: '보통', color: 'var(--warn)' };
        else spatialMemStatus = { label: '변동 있음', color: 'var(--warn)' };
      }
      
      return { speed: speedStatus, inhibit: inhibitStatus, workingMem: workingMemStatus, spatialMem: spatialMemStatus };
    }
    
    // 메인 렌더링
    async function render() {
      const token = getTokenFromUrl();
      
      if (!token) {
        app.innerHTML = `
          <div class="error-card">
            <div class="error-icon"><i class="fa-solid fa-link-slash"></i></div>
            <h2 class="error-title">잘못된 접근이에요</h2>
            <p class="error-desc">올바른 공유 링크로 접속해주세요.</p>
          </div>
        `;
        return;
      }
      
      try {
        const response = await fetch(`${API_URL}/api/guardian/data?token=${token}`);
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || '데이터를 불러올 수 없습니다.');
        }
        
        guardianData = data;
        renderData();
      } catch (e) {
        app.innerHTML = `
          <div class="error-card">
            <div class="error-icon"><i class="fa-solid fa-exclamation-triangle"></i></div>
            <h2 class="error-title">오류가 발생했어요</h2>
            <p class="error-desc">${e.message}</p>
          </div>
        `;
      }
    }
    
    // 데이터 렌더링
    function renderData() {
      const token = getTokenFromUrl();
      const { user, trainings, tests, stats } = guardianData;
      const status = getStatus(stats);
      const actionMessage = getActionMessage(status);
      
      // 참여한 날짜 Set (훈련 기준) - UTC를 한국시간으로 변환
      const participatedDates = new Set();
      (trainings || []).forEach(r => {
        // DB에서 온 UTC 시간을 한국 시간으로 변환
        const utcDate = new Date(r.date + 'Z'); // UTC로 파싱
        const koreaDate = new Date(utcDate.getTime() + (9 * 60 * 60 * 1000));
        const dateKey = koreaDate.toISOString().split('T')[0];
        participatedDates.add(dateKey);
      });
      
      // 선택된 주
      const weekDates = getWeekDates(selectedWeekOffset);
      const today = getDateKey();
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const isThisWeek = selectedWeekOffset === 0;
      
      // 선택된 주 참여 일수
      let weekDays = 0;
      weekDates.forEach(d => {
        if (participatedDates.has(d)) weekDays++;
      });
      
      // 주간 그리드 HTML
      let weekHtml = '';
      weekDates.forEach((dateKey, i) => {
        const isDone = participatedDates.has(dateKey);
        const isFuture = dateKey > today;
        const isToday = dateKey === today;
        
        let cellClass = 'week-day-cell';
        let icon = '';
        
        if (isDone) {
          cellClass += ' done';
          icon = '✔';
        } else if (isFuture) {
          cellClass += ' future';
          icon = '–';
        } else {
          cellClass += ' missed';
          icon = '✖';
        }
        
        if (isToday) cellClass += ' today';
        
        weekHtml += `
          <div class="week-day">
            <div class="week-day-name">${dayNames[i]}</div>
            <div class="${cellClass}" data-date="${dateKey}" data-done="${isDone}" data-future="${isFuture}">${icon}</div>
          </div>
        `;
      });
      
      // 메모
      const latestMemo = getLatestMemo(token);
      const memos = loadMemos(token);
      let memoHtml = '';
      if (latestMemo) {
        const memoDate = new Date(latestMemo.date);
        const memoDateStr = `${memoDate.getMonth() + 1}월 ${memoDate.getDate()}일`;
        memoHtml = `
          <div class="memo-display">
            <div class="memo-display-label">📝 ${memoDateStr} 메모</div>
            <div class="memo-display-text">${latestMemo.text}</div>
          </div>
        `;
        if (memos.length > 1) {
          memoHtml += `<button class="link-btn" id="viewMemoHistory" style="margin-bottom:12px;">이전 메모 ${memos.length - 1}개 보기</button>`;
        }
      }
      
      // 주간 상태
      const weeklyStatus = getWeeklyStatus(tests || [], selectedWeekOffset);
      
      // 최근 활동 HTML (훈련 + 검사 통합)
      let activityHtml = '';
      const allActivities = [
        ...(trainings || []).map(t => ({ ...t, testType: 'training' })),
        ...(tests || [])
      ].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
      
      if (allActivities.length === 0) {
        activityHtml = '<div class="empty-activity">아직 활동 기록이 없어요</div>';
      } else {
        allActivities.forEach((r, idx) => {
          const iconClass = getTestIconClass(r.testType);
          const icon = getTestIcon(r.testType);
          const name = getTestName(r.testType);
          const date = formatDate(r.date);
          
          let scoreText = '';
          if (r.summary) {
            if (r.testType === 'training') {
              scoreText = `${r.summary.correct || 0}/${r.summary.total || 0}`;
            } else if (r.summary.accuracy !== undefined) {
              scoreText = Math.round(r.summary.accuracy * 100) + '%';
            } else if (r.summary.totalSpan !== undefined) {
              scoreText = r.summary.totalSpan + '점';
            }
          }
          
          activityHtml += `
            <div class="activity-item" data-index="${idx}">
              <div class="activity-icon ${iconClass}">
                <i class="fa-solid ${icon}"></i>
              </div>
              <div class="activity-info">
                <div class="activity-name">${name}</div>
                <div class="activity-date">${date}</div>
              </div>
              ${scoreText ? `<div class="activity-score">${scoreText}</div>` : ''}
            </div>
          `;
        });
      }
      
      // 활동 데이터 저장 (모달에서 사용)
      guardianData.allActivities = allActivities;
      
      // 다음 리포트 날짜
      const nextSunday = new Date();
      nextSunday.setDate(nextSunday.getDate() + (7 - nextSunday.getDay()));
      const nextReportDate = `${nextSunday.getMonth() + 1}월 ${nextSunday.getDate()}일`;
      
      app.innerHTML = `
        <!-- 프로필 -->
        <div class="profile-card">
          <div class="profile-name">${user.name || '사용자'}님</div>
          <div class="profile-info">브레인 업과 함께하는 중</div>
          <div class="status-badge ${status.class}">${status.text}</div>
          <p style="font-size:14px;color:var(--muted);margin-top:8px;">${status.desc}</p>
        </div>
        
        <!-- 액션 -->
        <div class="action-card">
          <div class="action-message">${actionMessage}</div>
          ${memoHtml}
          <div style="display:flex;gap:10px;align-items:stretch;">
            <button class="action-btn ${status.class}" id="actionBtn" style="flex:1;">
              <i class="fa-solid fa-pen"></i>
              ${latestMemo ? '새 메모 작성' : '관찰 메모 남기기'}
            </button>
            ${latestMemo ? `<button class="action-btn" id="editMemoBtn" style="width:56px;padding:16px;background:var(--bg);color:var(--text);border:1px solid var(--border);"><i class="fa-solid fa-edit"></i></button>` : ''}
          </div>
          <div class="action-hint">부모님께 전화나 문자로 안부를 전해보세요</div>
        </div>
        
        <!-- 통계 -->
        <div class="stats-card">
          <div class="stats-title">
            <i class="fa-solid fa-chart-simple"></i>
            관리 참여 현황
          </div>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-value">${stats.streak}</div>
              <div class="stat-label">연속일</div>
            </div>
            <div class="stat-item">
              <div class="stat-value">${stats.maxStreak || stats.streak}</div>
              <div class="stat-label">최장 연속</div>
            </div>
            <div class="stat-item">
              <div class="stat-value">${stats.totalTrainings || 0}</div>
              <div class="stat-label">누적</div>
            </div>
          </div>
        </div>
        
        <!-- 주간 -->
        <div class="week-card">
          <div class="week-header">
            <div class="week-title">📋 주간 리포트</div>
          </div>
          
          <div class="week-nav">
            <button class="week-nav-btn" id="prevWeekBtn">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="week-nav-label">
              ${getWeekLabel(selectedWeekOffset)}
              ${isThisWeek ? '<br/><span class="this-week-badge">이번 주</span>' : ''}
            </div>
            <button class="week-nav-btn" id="nextWeekBtn" ${selectedWeekOffset >= 0 ? 'disabled' : ''}>
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
          
          <div class="week-grid">${weekHtml}</div>
          
          ${isThisWeek && stats.streak > 0 ? `
            <div class="streak-info">
              <i class="fa-solid fa-fire"></i>
              <span>${stats.streak}일 연속 참여 중</span>
            </div>
          ` : ''}
        </div>
        
        <!-- 주간 상태 -->
        <div class="status-card">
          <div class="stats-title">
            <i class="fa-solid fa-heart-pulse"></i>
            ${isThisWeek ? '이번 주' : '해당 주'} 상태
          </div>
          <div class="status-list">
            <div class="status-item">
              <div class="status-dot" style="background:${weeklyStatus.speed.color}"></div>
              <div class="status-item-label">처리속도</div>
              <div class="status-item-value" style="color:${weeklyStatus.speed.color}">${weeklyStatus.speed.label}</div>
            </div>
            <div class="status-item">
              <div class="status-dot" style="background:${weeklyStatus.inhibit.color}"></div>
              <div class="status-item-label">주의·억제</div>
              <div class="status-item-value" style="color:${weeklyStatus.inhibit.color}">${weeklyStatus.inhibit.label}</div>
            </div>
            <div class="status-item">
              <div class="status-dot" style="background:${weeklyStatus.workingMem.color}"></div>
              <div class="status-item-label">작업기억</div>
              <div class="status-item-value" style="color:${weeklyStatus.workingMem.color}">${weeklyStatus.workingMem.label}</div>
            </div>
            <div class="status-item">
              <div class="status-dot" style="background:${weeklyStatus.spatialMem.color}"></div>
              <div class="status-item-label">공간기억</div>
              <div class="status-item-value" style="color:${weeklyStatus.spatialMem.color}">${weeklyStatus.spatialMem.label}</div>
            </div>
          </div>
        </div>
        
        <!-- 최근 활동 -->
        <div class="activity-card">
          <div class="activity-title">
            <i class="fa-solid fa-clock-rotate-left"></i>
            최근 활동
          </div>
          <div class="activity-list">${activityHtml}</div>
        </div>
        
        <!-- 자녀 확인 중 -->
        ${isThisWeek ? `
          <div class="watching-card">
            <div class="watching-header">
              <div class="watching-dot"></div>
              <span class="watching-label">자녀 확인 중</span>
            </div>
            <div class="watching-text">
              다음 리포트: <strong>${nextReportDate}</strong><br/>
              변화가 생기면 확인할 수 있어요.
            </div>
          </div>
        ` : ''}
        
        <!-- 링크 복사 -->
        <button class="copy-link-btn" id="copyLinkBtn">
          <i class="fa-solid fa-link"></i>
          이 페이지 링크 복사
        </button>
        
        <!-- 안내 -->
        <div class="info-card">
          <p>
            <i class="fa-solid fa-info-circle"></i>
            이 페이지는 부모님의 뇌 건강 관리 현황을 보여줍니다.
          </p>
        </div>
      `;
      
      // 이벤트 바인딩
      bindEvents();
    }
    
    // 이벤트 바인딩
    function bindEvents() {
      const token = getTokenFromUrl();
      
      // 메모 버튼 (새 메모)
      document.getElementById('actionBtn')?.addEventListener('click', () => {
        editingMemoIndex = null;
        document.getElementById('memoText').value = '';
        document.getElementById('memoModalTitle').textContent = '📝 관찰 메모';
        document.getElementById('memoModal').classList.add('active');
      });
      
      // 수정 버튼 (최신 메모 수정)
      document.getElementById('editMemoBtn')?.addEventListener('click', () => {
        const memos = loadMemos(token);
        if (memos.length > 0) {
          const lastIndex = memos.length - 1;
          openEditMemoModal(lastIndex, memos[lastIndex].text);
        }
      });
      
      // 메모 히스토리
      document.getElementById('viewMemoHistory')?.addEventListener('click', () => {
        renderMemoHistory();
      });
      
      // 주 네비게이션
      document.getElementById('prevWeekBtn')?.addEventListener('click', () => {
        selectedWeekOffset--;
        renderData();
      });
      
      document.getElementById('nextWeekBtn')?.addEventListener('click', () => {
        if (selectedWeekOffset < 0) {
          selectedWeekOffset++;
          renderData();
        }
      });
      
      // 날짜 셀 클릭
      document.querySelectorAll('.week-day-cell').forEach(cell => {
        cell.addEventListener('click', () => {
          const dateKey = cell.dataset.date;
          const isDone = cell.dataset.done === 'true';
          const isFuture = cell.dataset.future === 'true';
          
          let text = '';
          if (isFuture) text = '아직 지나지 않은 날이에요.';
          else if (isDone) text = '이 날은 참여했어요! 👏';
          else text = '이 날은 참여 기록이 없어요.';
          
          document.getElementById('dayModalDate').textContent = formatDateShort(dateKey);
          document.getElementById('dayModalText').textContent = text;
          document.getElementById('dayModal').classList.add('active');
        });
      });
      
      // 활동 아이템 클릭
      document.querySelectorAll('.activity-item').forEach(item => {
        item.addEventListener('click', () => {
          const idx = parseInt(item.dataset.index);
          const result = guardianData.allActivities[idx];
          if (result) showActivityDetail(result);
        });
      });
      
      // 링크 복사
      document.getElementById('copyLinkBtn')?.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(window.location.href);
          const btn = document.getElementById('copyLinkBtn');
          btn.innerHTML = '<i class="fa-solid fa-check"></i> 복사 완료!';
          btn.style.background = '#dcfce7';
          btn.style.color = 'var(--good)';
          setTimeout(() => {
            btn.innerHTML = '<i class="fa-solid fa-link"></i> 이 페이지 링크 복사';
            btn.style.background = '';
            btn.style.color = '';
          }, 2000);
        } catch {
          alert('링크 복사에 실패했어요.');
        }
      });
    }
    
    // 활동 상세 모달
    function showActivityDetail(result) {
      const name = getTestName(result.testType);
      const date = formatDate(result.date);
      
      let content = `<p style="color:var(--muted);margin-bottom:12px;">${date}</p>`;
      
      if (result.summary) {
        if (result.testType === 'training') {
          content += `
            <div style="background:var(--bg);padding:14px;border-radius:12px;margin-bottom:8px;">
              <div style="font-size:13px;color:var(--muted);">정답</div>
              <div style="font-size:20px;font-weight:700;color:var(--accent);">${result.summary.correct || 0} / ${result.summary.total || 0}</div>
            </div>
          `;
          if (result.summary.span) {
            content += `
              <div style="background:var(--bg);padding:14px;border-radius:12px;">
                <div style="font-size:13px;color:var(--muted);">자릿수</div>
                <div style="font-size:20px;font-weight:700;color:var(--accent);">${result.summary.span}자리</div>
              </div>
            `;
          }
        } else if (result.testType === 'pattern') {
          content += `
            <div style="background:var(--bg);padding:14px;border-radius:12px;margin-bottom:8px;">
              <div style="font-size:13px;color:var(--muted);">정확도</div>
              <div style="font-size:20px;font-weight:700;color:var(--accent);">${Math.round((result.summary.accuracy || 0) * 100)}%</div>
            </div>
          `;
          if (result.summary.meanRtMs) {
            content += `
              <div style="background:var(--bg);padding:14px;border-radius:12px;">
                <div style="font-size:13px;color:var(--muted);">평균 반응속도</div>
                <div style="font-size:20px;font-weight:700;color:var(--accent);">${Math.round(result.summary.meanRtMs)}ms</div>
              </div>
            `;
          }
        } else if (result.testType === 'gonogo') {
          content += `
            <div style="background:var(--bg);padding:14px;border-radius:12px;margin-bottom:8px;">
              <div style="font-size:13px;color:var(--muted);">Go 정확도</div>
              <div style="font-size:20px;font-weight:700;color:var(--accent);">${Math.round((result.summary.goAcc || 0) * 100)}%</div>
            </div>
            <div style="background:var(--bg);padding:14px;border-radius:12px;">
              <div style="font-size:13px;color:var(--muted);">No-Go 정확도</div>
              <div style="font-size:20px;font-weight:700;color:var(--accent);">${Math.round((result.summary.nogoAcc || 0) * 100)}%</div>
            </div>
          `;
        } else if (result.testType === 'digitspan') {
          content += `
            <div style="background:var(--bg);padding:14px;border-radius:12px;">
              <div style="font-size:13px;color:var(--muted);">총 점수</div>
              <div style="font-size:20px;font-weight:700;color:var(--accent);">${result.summary.totalSpan || 0}점</div>
            </div>
          `;
        }
      }
      
      document.getElementById('activityModalTitle').textContent = name;
      document.getElementById('activityModalContent').innerHTML = content;
      document.getElementById('activityModal').classList.add('active');
    }
    
    // 메모 히스토리
    function renderMemoHistory() {
      const token = getTokenFromUrl();
      const memos = loadMemos(token);
      const pastMemos = memos.slice(0, -1).reverse();
      
      let html = '';
      pastMemos.forEach((m, i) => {
        const d = new Date(m.date);
        const dateStr = `${d.getMonth() + 1}월 ${d.getDate()}일`;
        const originalIndex = memos.length - 2 - i;
        
        html += `
          <div class="memo-history-item">
            <div class="memo-history-content">
              <div class="memo-history-date">${dateStr}</div>
              <div class="memo-history-text">${m.text}</div>
            </div>
            <button class="memo-edit-btn" data-index="${originalIndex}" style="background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:4px;margin-right:4px;"><i class="fa-solid fa-edit"></i></button>
            <button class="memo-delete-btn" data-index="${originalIndex}">&times;</button>
          </div>
        `;
      });
      
      if (pastMemos.length === 0) {
        html = '<div style="text-align:center;color:var(--muted);padding:20px;">이전 메모가 없어요</div>';
      }
      
      document.getElementById('memoHistoryList').innerHTML = html;
      document.getElementById('memoHistoryModal').classList.add('active');
      
      // 수정 버튼
      document.querySelectorAll('.memo-edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.index);
          const memos = loadMemos(token);
          const memo = memos[idx];
          if (memo) {
            document.getElementById('memoHistoryModal').classList.remove('active');
            openEditMemoModal(idx, memo.text);
          }
        });
      });
      
      // 삭제 버튼
      document.querySelectorAll('.memo-delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.index);
          if (confirm('이 메모를 삭제할까요?')) {
            deleteMemo(token, idx);
            const remaining = loadMemos(token);
            if (remaining.length <= 1) {
              document.getElementById('memoHistoryModal').classList.remove('active');
              renderData();
            } else {
              renderMemoHistory();
            }
          }
        });
      });
    }
    
    // 모달 이벤트
    document.getElementById('memoCancel').addEventListener('click', () => {
      editingMemoIndex = null;
      document.getElementById('memoModal').classList.remove('active');
    });
    
    document.getElementById('memoSave').addEventListener('click', () => {
      const token = getTokenFromUrl();
      const text = document.getElementById('memoText').value.trim();
      if (text) {
        if (editingMemoIndex !== null) {
          updateMemo(token, editingMemoIndex, text);
        } else {
          saveMemo(token, text);
        }
        editingMemoIndex = null;
        document.getElementById('memoModal').classList.remove('active');
        renderData();
      }
    });
    
    document.getElementById('dayModalClose').addEventListener('click', () => {
      document.getElementById('dayModal').classList.remove('active');
    });
    
    document.getElementById('activityModalClose').addEventListener('click', () => {
      document.getElementById('activityModal').classList.remove('active');
    });
    
    document.getElementById('memoHistoryClose').addEventListener('click', () => {
      document.getElementById('memoHistoryModal').classList.remove('active');
    });
    
    // 모달 오버레이 클릭
    document.querySelectorAll('.modal-overlay').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
        }
      });
    });
    
    // 시작
    render();
  </script>
</body>
</html>
