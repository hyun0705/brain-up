<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>브레인 업 - 부모님 관리 현황</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #3b82f6;
      --accent-light: #eff6ff;
      --good: #10b981;
      --good-light: #d1fae5;
      --warn: #f59e0b;
      --warn-light: #fef3c7;
      --danger: #ef4444;
      --danger-light: #fee2e2;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #f0f9ff;
      min-height: 100vh;
      color: var(--text);
    }
    
    .guardian-container {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 16px 100px;
      min-height: 100vh;
    }
    
    .guardian-header {
      text-align: center;
      padding: 20px 0 24px;
    }
    
    .guardian-logo {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
    }
    
    .status-summary {
      background: var(--card);
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 14px;
      animation: fadeInUp 0.4s ease;
    }
    
    .status-badge.stable { 
      background: var(--good-light); 
      color: #059669;
    }
    .status-badge.caution { 
      background: var(--warn-light); 
      color: #b45309;
    }
    .status-badge.alert { 
      background: var(--danger-light); 
      color: #dc2626;
    }
    
    .status-change {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      animation: fadeIn 0.5s ease 0.2s both;
    }
    
    .action-section {
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    
    .action-message {
      font-size: 15px;
      color: var(--text);
      line-height: 1.7;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .memo-display {
      background: var(--accent-light);
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease;
    }
    
    .memo-display-label {
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .memo-display-text {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
    }
    
    .action-btn {
      width: 100%;
      padding: 16px 24px;
      background: var(--accent);
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    
    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59,130,246,0.3);
    }
    
    .action-btn:active {
      transform: translateY(0);
    }
    
    .action-btn.caution { 
      background: var(--warn);
    }
    .action-btn.alert { 
      background: var(--danger);
    }
    
    .action-hint {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-top: 14px;
    }
    
    .week-section {
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    
    .week-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    
    .week-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    
    .week-count {
      font-size: 14px;
      color: var(--accent);
      font-weight: 600;
      background: var(--accent-light);
      padding: 4px 12px;
      border-radius: 20px;
    }
    
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    
    .week-day { text-align: center; }
    
    .week-day-name {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    .week-day-cell {
      width: 38px;
      height: 38px;
      margin: 0 auto;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }
    
    .week-day-cell:hover {
      transform: scale(1.1);
    }
    
    .week-day-cell.done { 
      background: var(--good-light); 
      color: var(--good);
    }
    .week-day-cell.missed { 
      background: var(--warn-light); 
      color: #b45309;
    }
    .week-day-cell.future { 
      background: var(--bg); 
      color: var(--muted);
    }
    .week-day-cell.today { 
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    
    .streak-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--text);
      font-weight: 600;
    }
    
    .streak-info i { 
      color: #ea580c;
      animation: fireGlow 1.5s ease infinite;
    }
    
    .locked-section {
      background: var(--card);
      border-radius: 24px;
      padding: 20px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    
    .locked-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .locked-item:hover {
      padding-left: 8px;
    }
    
    .locked-item:last-child { border-bottom: none; padding-bottom: 0; }
    .locked-item:first-child { padding-top: 0; }
    
    .locked-label { font-size: 14px; color: var(--muted); }
    
    .locked-badge {
      font-size: 12px;
      color: #b45309;
      background: var(--warn-light);
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
    }
    
    .guardian-footer {
      text-align: center;
      padding: 24px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    
    /* 주 선택 네비게이션 */
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    
    .week-nav-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--bg);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: all 0.2s ease;
    }
    
    .week-nav-btn:hover:not(:disabled) {
      background: var(--accent-light);
      color: var(--accent);
    }
    
    .week-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    
    .week-nav-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      min-width: 140px;
      text-align: center;
    }
    
    .week-nav-label .this-week-badge {
      display: inline-block;
      font-size: 11px;
      background: var(--accent);
      color: white;
      padding: 3px 10px;
      border-radius: 10px;
      margin-top: 6px;
    }
    
    /* 모달 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,23,42,0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    
    .modal-overlay.active { 
      opacity: 1; 
      visibility: visible;
    }
    
    .modal-overlay.active .modal-content,
    .modal-overlay.active .day-modal-content,
    .modal-overlay.active .premium-modal-content {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    
    .modal-content {
      background: var(--card);
      border-radius: 24px;
      padding: 28px;
      max-width: 360px;
      width: 100%;
      transform: translateY(20px) scale(0.95);
      opacity: 0;
      transition: all 0.3s ease;
    }
    
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 20px;
      text-align: center;
    }
    
    .memo-textarea {
      width: 100%;
      height: 140px;
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 16px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      margin-bottom: 20px;
      transition: border-color 0.2s ease;
    }
    
    .memo-textarea:focus { 
      outline: none; 
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
    }
    
    .modal-btns { display: flex; gap: 12px; }
    
    .modal-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .modal-btn:hover {
      transform: translateY(-2px);
    }
    
    .modal-btn.cancel { 
      background: var(--bg); 
      color: var(--muted);
    }
    .modal-btn.primary { 
      background: var(--accent); 
      color: white;
    }
    
    .day-modal-content {
      background: var(--card);
      border-radius: 24px;
      padding: 28px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      transform: translateY(20px) scale(0.95);
      opacity: 0;
      transition: all 0.3s ease;
    }
    
    .day-modal-date { 
      font-size: 14px; 
      color: var(--accent); 
      font-weight: 600;
      margin-bottom: 10px; 
    }
    .day-modal-text { 
      font-size: 17px; 
      color: var(--text); 
      line-height: 1.6; 
      margin-bottom: 20px;
      font-weight: 500;
    }
    
    .day-modal-close {
      background: var(--bg);
      border: none;
      padding: 14px 32px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .day-modal-close:hover {
      background: var(--border);
    }
    
    .premium-modal-content {
      background: var(--card);
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      transform: translateY(20px) scale(0.95);
      opacity: 0;
      transition: all 0.3s ease;
    }
    
    .premium-modal-icon { 
      font-size: 48px; 
      margin-bottom: 20px;
      animation: bounce 1s ease infinite;
    }
    .premium-modal-title { 
      font-size: 18px; 
      font-weight: 800; 
      color: var(--text); 
      margin-bottom: 12px; 
    }
    .premium-modal-desc { 
      font-size: 15px; 
      color: var(--muted); 
      line-height: 1.7; 
      margin-bottom: 24px; 
    }
    
    .premium-modal-btn {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    
    .premium-modal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59,130,246,0.3);
    }
    
    .premium-modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      padding: 12px;
      transition: color 0.2s ease;
    }
    
    .premium-modal-close:hover {
      color: var(--text);
    }
    
    .error-card {
      background: var(--card);
      border-radius: 24px;
      padding: 48px 28px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    
    .error-icon { 
      font-size: 56px; 
      color: var(--muted); 
      margin-bottom: 20px;
      opacity: 0.6;
    }
    .error-title { 
      font-size: 20px; 
      font-weight: 800; 
      color: var(--text); 
      margin-bottom: 10px; 
    }
    .error-desc { 
      font-size: 15px; 
      color: var(--muted); 
      line-height: 1.7; 
    }
    
    .dev-tools {
      margin-top: 24px;
      padding: 16px;
      background: #fef2f2;
      border: 2px dashed #fca5a5;
      border-radius: 16px;
    }
    
    .dev-tools-title { 
      font-size: 12px; 
      font-weight: 700; 
      color: #dc2626; 
      margin-bottom: 12px; 
    }
    
    .dev-btn {
      width: 100%;
      padding: 14px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .dev-btn:hover {
      transform: translateY(-2px);
    }
    
    .linkBtn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    
    .linkBtn:hover {
      color: #2563eb;
      text-decoration: underline;
    }
    
    /* 애니메이션 */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes fadeInUp {
      from { 
        opacity: 0; 
        transform: translateY(10px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }
    
    @keyframes fireGlow {
      0%, 100% { 
        filter: drop-shadow(0 0 2px rgba(234,88,12,0.4));
        transform: scale(1);
      }
      50% { 
        filter: drop-shadow(0 0 6px rgba(234,88,12,0.6));
        transform: scale(1.1);
      }
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    
    /* 스크롤바 스타일 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }
  </style>
</head>

<body>
  <div class="guardian-container">
    <header class="guardian-header">
      <div class="guardian-logo">브레인 업</div>
    </header>

    <main id="guardian-app"></main>

    <footer class="guardian-footer">
      부모님의 관리 습관을 함께 지켜봐요<br/>
      브레인 업 · 가족 케어 서비스
    </footer>
    
    <div class="dev-tools" id="devTools">
      <div class="dev-tools-title">⚠️ 개발자 테스트용 (배포 전 제거)</div>
      <button class="dev-btn" id="devUnlockBtn">유료 전환 테스트</button>
    </div>
  </div>

  <!-- 메모 모달 -->
  <div class="modal-overlay" id="memoModal">
    <div class="modal-content">
      <div class="modal-title">📝 이번 주 관찰 메모</div>
      <textarea class="memo-textarea" id="memoText" placeholder="부모님 상태에 대해 메모해두세요."></textarea>
      <div class="modal-btns">
        <button class="modal-btn cancel" id="memoCancel">취소</button>
        <button class="modal-btn primary" id="memoSave">저장</button>
      </div>
    </div>
  </div>

  <!-- 날짜 모달 -->
  <div class="modal-overlay" id="dayModal">
    <div class="day-modal-content">
      <div class="day-modal-date" id="dayModalDate"></div>
      <div class="day-modal-text" id="dayModalText"></div>
      <button class="day-modal-close" id="dayModalClose">확인</button>
    </div>
  </div>

  <!-- 유료 안내 모달 -->
  <div class="modal-overlay" id="premiumModal">
    <div class="premium-modal-content">
      <div class="premium-modal-icon">🔒</div>
      <h2 class="premium-modal-title">구독이 필요한 기능이에요</h2>
      <p class="premium-modal-desc">
        장기 변화 추이를 확인하려면<br/>
        부모님 화면에서 구독이 필요해요.
      </p>
      <button class="premium-modal-btn" id="requestSubscribeBtn">부모님께 구독 요청 보내기</button>
      <button class="premium-modal-close" id="closePremiumModal">닫기</button>
    </div>
  </div>

  <!-- 메모 히스토리 모달 -->
  <div class="modal-overlay" id="memoHistoryModal">
    <div class="modal-content" style="max-height:80vh;overflow-y:auto;">
      <div class="modal-title">📝 이전 메모 기록</div>
      <div id="memoHistoryList" style="max-height:50vh;overflow-y:auto;"></div>
      <div class="modal-btns" style="margin-top:16px;">
        <button class="modal-btn cancel" id="closeMemoHistory" style="flex:1;">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // 상수
    var GUARDIAN_TOKENS_KEY = 'guardian_tokens_v1';
    var MEMO_KEY = 'guardian_memo_v1';
    var TRAINING_HISTORY_KEY = 'bc_digitspan_training_history_v1';
    
    // 현재 선택된 주 오프셋 (0 = 이번 주, -1 = 지난 주, -2 = 2주 전...)
    var selectedWeekOffset = 0;

    // 유틸
    function getTokenFromUrl() {
      var params = new URLSearchParams(window.location.search);
      return params.get('token');
    }

    function loadGuardianTokens() {
      try {
        return JSON.parse(localStorage.getItem(GUARDIAN_TOKENS_KEY) || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveGuardianTokens(tokens) {
      localStorage.setItem(GUARDIAN_TOKENS_KEY, JSON.stringify(tokens));
    }

    function resolveGuardianToken(token) {
      if (!token) return null;
      var tokens = loadGuardianTokens();
      var entry = tokens[token];
      return entry ? entry.anonId : null;
    }

    function isGuardianTokenPaid(token) {
      if (!token) return false;
      var tokens = loadGuardianTokens();
      var entry = tokens[token];
      return !!(entry && entry.isPaid);
    }

    function setGuardianTokenPaid(token, isPaid) {
      if (!token) return false;
      var tokens = loadGuardianTokens();
      var entry = tokens[token];
      if (!entry) return false;
      entry.isPaid = isPaid;
      entry.paidAt = isPaid ? Date.now() : null;
      saveGuardianTokens(tokens);
      return true;
    }

    function getDateKey(date) {
      if (!date) date = new Date();
      var y = date.getFullYear();
      var m = String(date.getMonth() + 1).padStart(2, '0');
      var d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function loadTrainingHistory() {
      try {
        return JSON.parse(localStorage.getItem(TRAINING_HISTORY_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function loadMemo(token) {
      try {
        var memos = JSON.parse(localStorage.getItem(MEMO_KEY) || '{}');
        var tokenMemos = memos[token];
        
        if (tokenMemos && !Array.isArray(tokenMemos)) {
          tokenMemos = [{ text: String(tokenMemos), date: Date.now() }];
          memos[token] = tokenMemos;
          localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
        }
        
        if (!tokenMemos || tokenMemos.length === 0) return null;
        return tokenMemos[tokenMemos.length - 1];
      } catch (e) {
        console.log('loadMemo error:', e);
        return null;
      }
    }

    function loadMemoHistory(token) {
      try {
        var memos = JSON.parse(localStorage.getItem(MEMO_KEY) || '{}');
        var tokenMemos = memos[token];
        
        if (tokenMemos && !Array.isArray(tokenMemos)) {
          tokenMemos = [{ text: String(tokenMemos), date: Date.now() }];
          memos[token] = tokenMemos;
          localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
        }
        
        return tokenMemos || [];
      } catch (e) {
        return [];
      }
    }

    function saveMemo(token, text) {
      try {
        var memos = JSON.parse(localStorage.getItem(MEMO_KEY) || '{}');
        if (!memos[token]) memos[token] = [];
        memos[token].push({
          text: text,
          date: Date.now()
        });
        localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
      } catch (e) {}
    }

    function deleteMemo(token, index) {
      try {
        var memos = JSON.parse(localStorage.getItem(MEMO_KEY) || '{}');
        if (memos[token] && Array.isArray(memos[token])) {
          memos[token].splice(index, 1);
          localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
        }
      } catch (e) {}
    }

      var history = loadMemoHistory(token);

          '<div style="font-size:14px;color:var(--text);line-height:1.5;white-space:pre-wrap;">' + m.text.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>' +

            deleteMemo(token, idx);

            var remaining = loadMemoHistory(token);

              document.getElementById('memoHistoryModal').classList.remove('active');
              renderGuardianView();
            }
          }

      }
    }

    // 특정 주의 날짜 배열 가져오기 (offset: 0=이번주, -1=지난주...)
    function getWeekDates(offset) {
      if (!offset) offset = 0;
      var today = new Date();
      var dayOfWeek = today.getDay();
      var sunday = new Date(today);
      sunday.setDate(today.getDate() - dayOfWeek + (offset * 7));
      
      var dates = [];
      for (var i = 0; i < 7; i++) {
        var d = new Date(sunday);
        d.setDate(sunday.getDate() + i);
        dates.push(getDateKey(d));
      }
      return dates;
    }

    function getThisWeekDates() {
      return getWeekDates(0);
    }

    function getLastWeekDates() {
      return getWeekDates(-1);
    }

    // 주 라벨 생성 (예: "1월 5일 ~ 11일")
    function getWeekLabel(offset) {
      var dates = getWeekDates(offset);
      var startDate = new Date(dates[0]);
      var endDate = new Date(dates[6]);
      
      var startMonth = startDate.getMonth() + 1;
      var startDay = startDate.getDate();
      var endMonth = endDate.getMonth() + 1;
      var endDay = endDate.getDate();
      
      if (startMonth === endMonth) {
        return startMonth + '월 ' + startDay + '일 ~ ' + endDay + '일';
      } else {
        return startMonth + '월 ' + startDay + '일 ~ ' + endMonth + '월 ' + endDay + '일';
      }
    }

    // 가장 오래된 기록이 있는 주 오프셋 계산
    function getOldestWeekOffset() {
      var history = loadTrainingHistory();
      if (history.length === 0) return 0;
      
      // 가장 오래된 기록 찾기
      var oldestDate = null;
      for (var i = 0; i < history.length; i++) {
        var d = new Date(history[i].date_key);
        if (!oldestDate || d < oldestDate) {
          oldestDate = d;
        }
      }
      
      if (!oldestDate) return 0;
      
      // 오늘 기준 몇 주 전인지 계산
      var today = new Date();
      var diffTime = today - oldestDate;
      var diffWeeks = Math.floor(diffTime / (7 * 24 * 60 * 60 * 1000));
      
      return -diffWeeks - 1; // 최소 한 주 전까지 더 볼 수 있게
    }

    function getWeekTrainingCount(history, weekDates) {
      var trainedDates = {};
      for (var i = 0; i < history.length; i++) {
        trainedDates[history[i].date_key] = true;
      }
      var count = 0;
      for (var j = 0; j < weekDates.length; j++) {
        if (trainedDates[weekDates[j]]) count++;
      }
      return count;
    }

    function getStreak(history) {
      if (history.length === 0) return 0;
      var dateSet = {};
      for (var i = 0; i < history.length; i++) {
        dateSet[history[i].date_key] = true;
      }
      var streak = 0;
      var today = new Date();
      
      for (var j = 0; j < 100; j++) {
        var checkDate = new Date(today);
        checkDate.setDate(today.getDate() - j);
        var checkKey = getDateKey(checkDate);
        if (dateSet[checkKey]) {
          streak++;
        } else {
          break;
        }
      }
      return streak;
    }

    function getStatus(thisWeekCount, lastWeekCount) {
      var today = new Date();
      var dayOfWeek = today.getDay();
      var daysPassed = dayOfWeek === 0 ? 7 : dayOfWeek;
      var expectedMin = Math.max(1, Math.floor(daysPassed * 0.5));
      
      if (thisWeekCount === 0 && daysPassed >= 3) {
        return 'alert';
      }
      if (lastWeekCount > 0 && thisWeekCount < lastWeekCount - 2) {
        return 'caution';
      }
      if (thisWeekCount < expectedMin && daysPassed >= 3) {
        return 'caution';
      }
      return 'stable';
    }

    function getChangeText(thisWeekCount, lastWeekCount) {
      var diff = thisWeekCount - lastWeekCount;
      
      if (lastWeekCount === 0 && thisWeekCount === 0) {
        return '아직 참여 기록이 없어요';
      }
      if (lastWeekCount === 0) {
        return '이번 주부터 참여하고 있어요';
      }
      if (diff >= 2) {
        return '지난주보다 더 자주 참여하고 있어요';
      }
      if (diff > 0) {
        return '지난주보다 조금 더 참여했어요';
      }
      if (diff === 0) {
        return '지난주와 비슷해요';
      }
      if (diff >= -2) {
        return '지난주보다 참여가 조금 줄었어요';
      }
      return '지난주보다 참여가 많이 줄었어요';
    }

    function getActionMessage(status) {
      if (status === 'stable') {
        return '이번 주는 안심해도 괜찮아요.<br/>특이사항이 있으면 메모해두세요.';
      }
      if (status === 'caution') {
        return '참여 빈도에 기복이 보여요.<br/>관찰 내용을 기록해두세요.';
      }
      return '직접 확인이 필요한 신호가 있어요.<br/>관찰 내용을 남겨두세요.';
    }

    function formatDate(dateKey) {
      var parts = dateKey.split('-');
      return parseInt(parts[1]) + '월 ' + parseInt(parts[2]) + '일';
    }

    // 특정 주의 상태 계산 함수
    function getWeeklyStatusForOffset(offset) {
      var patternHistory = [];
      var gonogoHistory = [];
      var digitspanHistory = [];
      
      try {
        patternHistory = JSON.parse(localStorage.getItem('bc_pattern_history_v1') || '[]');
        gonogoHistory = JSON.parse(localStorage.getItem('bc_gonogo_history_v1') || '[]');
        digitspanHistory = JSON.parse(localStorage.getItem('bc_digitspan_history_v1') || '[]');
      } catch (e) {}
      
      var weekDates = getWeekDates(offset);
      var weekStart = new Date(weekDates[0]);
      var weekEnd = new Date(weekDates[6]);
      weekEnd.setHours(23, 59, 59, 999);
      
      var filterWeek = function(arr) {
        return arr.filter(function(item) {
          var d = new Date(item.ended_at);
          return d >= weekStart && d <= weekEnd;
        });
      };
      
      var weekPattern = filterWeek(patternHistory);
      var weekGonogo = filterWeek(gonogoHistory);
      var weekDigitspan = filterWeek(digitspanHistory);
      
      // 반응 속도
      var speedStatus = { label: '데이터 없음', color: 'var(--muted)' };
      if (weekPattern.length > 0) {
        var avgRt = weekPattern.reduce(function(sum, p) { return sum + (p.summary.meanRtMs || 0); }, 0) / weekPattern.length;
        var avgAcc = weekPattern.reduce(function(sum, p) { return sum + (p.summary.accuracy || 0); }, 0) / weekPattern.length;
        
        if (avgAcc >= 0.85 && avgRt < 1500) {
          speedStatus = { label: '안정적', color: 'var(--good)' };
        } else if (avgAcc >= 0.7) {
          speedStatus = { label: '양호', color: 'var(--good)' };
        } else {
          speedStatus = { label: '변동 있음', color: '#f59e0b' };
        }
      }
      
      // 집중력
      var focusStatus = { label: '데이터 없음', color: 'var(--muted)' };
      if (weekGonogo.length > 0) {
        var avgGoAcc = weekGonogo.reduce(function(sum, g) { return sum + (g.summary.goAcc || 0); }, 0) / weekGonogo.length;
        var avgNogoAcc = weekGonogo.reduce(function(sum, g) { return sum + (g.summary.nogoAcc || 0); }, 0) / weekGonogo.length;
        var combined = (avgGoAcc + avgNogoAcc) / 2;
        
        if (combined >= 0.85) {
          focusStatus = { label: '양호', color: 'var(--good)' };
        } else if (combined >= 0.7) {
          focusStatus = { label: '보통', color: 'var(--good)' };
        } else {
          focusStatus = { label: '변동 있음', color: '#f59e0b' };
        }
      }
      
      // 기억 유지
      var memoryStatus = { label: '데이터 없음', color: 'var(--muted)' };
      if (weekDigitspan.length > 0) {
        var avgSpan = weekDigitspan.reduce(function(sum, d) { return sum + (d.summary.totalSpan || 0); }, 0) / weekDigitspan.length;
        
        if (avgSpan >= 10) {
          memoryStatus = { label: '유지 중', color: 'var(--good)' };
        } else if (avgSpan >= 7) {
          memoryStatus = { label: '양호', color: 'var(--good)' };
        } else if (avgSpan >= 5) {
          memoryStatus = { label: '보통', color: '#f59e0b' };
        } else {
          memoryStatus = { label: '변동 있음', color: '#f59e0b' };
        }
      }
      
      return {
        speed: speedStatus,
        focus: focusStatus,
        memory: memoryStatus
      };
    }

          '<span style="width:8px;height:8px;border-radius:50%;background:' + weeklyStatus.speed.color + ';"></span>' +
          '<span style="flex:1;font-size:14px;color:var(--text);">반응 속도</span>' +
          '<span style="font-size:14px;font-weight:600;color:' + weeklyStatus.speed.color + ';">' + weeklyStatus.speed.label + '</span>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-radius:10px;">' +
          '<span style="width:8px;height:8px;border-radius:50%;background:' + weeklyStatus.focus.color + ';"></span>' +
          '<span style="flex:1;font-size:14px;color:var(--text);">집중력</span>' +
          '<span style="font-size:14px;font-weight:600;color:' + weeklyStatus.focus.color + ';">' + weeklyStatus.focus.label + '</span>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-radius:10px;">' +
          '<span style="width:8px;height:8px;border-radius:50%;background:' + weeklyStatus.memory.color + ';"></span>' +
          '<span style="flex:1;font-size:14px;color:var(--text);">기억 유지</span>' +
          '<span style="font-size:14px;font-weight:600;color:' + weeklyStatus.memory.color + ';">' + weeklyStatus.memory.label + '</span>' +
          '</div>' +
          '</div>' +
          '</div></div>';
        
        // 자녀 참여감 문구 (이번 주일 때만)
        if (isThisWeek) {
          var nextSunday = new Date();
          nextSunday.setDate(nextSunday.getDate() + (7 - nextSunday.getDay()));
          var nextReportDate = (nextSunday.getMonth() + 1) + '월 ' + nextSunday.getDate() + '일';
          
          html += '<div style="background:#f0fdf4;border-radius:12px;padding:16px;">' +
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">' +
            '<span style="width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 2s infinite;"></span>' +
            '<span style="font-size:13px;color:#15803d;font-weight:600;">자녀 확인 중</span>' +
            '</div>' +
            '<div style="font-size:13px;color:var(--muted);line-height:1.6;">' +
            '다음 리포트: <strong style="color:var(--text);">' + nextReportDate + '</strong><br/>' +
            '변화가 생기면 다음 리포트에서 확인할 수 있어요.' +
            '</div>' +
            '</div>';
        }
        
      } else {
        // 무료: 이번 주 참여 + 잠금 표시
        html += '<div class="week-section">' +
          '<div class="week-header">' +
          '<div class="week-title">이번 주 참여</div>' +
          '<div class="week-count">' + thisWeekCount + '일 참여</div>' +
          '</div>' +
          '<div class="week-grid">' + weekHtml + '</div>';
        
        if (streak > 0) {
          html += '<div class="streak-info">' +
            '<i class="fa-solid fa-fire"></i>' +
            '<span>' + streak + '일 연속 참여 중</span>' +
            '</div>';
        }
        
        html += '</div>';
        
        html += '<div class="locked-section">' +
          '<div class="locked-item" data-action="trend">' +
          '<span class="locked-label">최근 4주 변화 추이 보기</span>' +
          '<span class="locked-badge">🔒</span>' +
          '</div>' +
          '<div class="locked-item" data-action="pattern">' +
          '<span class="locked-label">반복되는 패턴 확인하기</span>' +
          '<span class="locked-badge">🔒</span>' +
          '</div>' +
          '</div>';
      }
      
      // 링크 저장 안내
      html += '<div style="background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);margin-top:16px;">' +
        '<div style="font-size:14px;color:var(--text);font-weight:600;margin-bottom:8px;">🔗 이 페이지 저장하기</div>' +
        '<div style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px;">' +
        '다음에 쉽게 확인하려면<br/>북마크 추가하거나 홈 화면에 저장해두세요.' +
        '</div>' +
        '<button id="copyLinkBtn" style="width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:14px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">' +
        '<i class="fa-solid fa-link"></i> 링크 복사하기' +
        '</button>' +
        '</div>';

      app.innerHTML = html;

      // 이벤트 바인딩
      document.getElementById('actionBtn').addEventListener('click', function() {
        document.getElementById('memoText').value = '';
        document.getElementById('memoModal').classList.add('active');
      });

      var historyBtn = document.getElementById('viewMemoHistory');
      if (historyBtn) {
        historyBtn.addEventListener('click', function() {
          renderMemoHistoryModal(token);
        });
      }

      // 주 네비게이션 버튼 (유료일 때만)
      if (isPaid) {
        var prevBtn = document.getElementById('prevWeekBtn');
        var nextBtn = document.getElementById('nextWeekBtn');
        
        if (prevBtn) {
          prevBtn.addEventListener('click', function() {
            if (!this.disabled) {
              selectedWeekOffset--;
              renderGuardianView();
            }
          });
        }
        
        if (nextBtn) {
          nextBtn.addEventListener('click', function() {
            if (!this.disabled) {
              selectedWeekOffset++;
              renderGuardianView();
            }
          });
        }
      }

      // 날짜 셀 클릭
      var cells = document.querySelectorAll('.week-day-cell');
      for (var k = 0; k < cells.length; k++) {
        cells[k].addEventListener('click', function() {
          var dateKey = this.getAttribute('data-date');
          var isDone = this.getAttribute('data-done') === 'true';
          var isFuture = this.getAttribute('data-future') === 'true';
          
          var text = '';
          if (isFuture) {
            text = '아직 지나지 않은 날이에요.';
          } else if (isDone) {
            text = '이 날은 참여했어요.';
          } else {
            text = '이 날은 참여 기록이 없어요.';
          }
          
          document.getElementById('dayModalDate').textContent = formatDate(dateKey);
          document.getElementById('dayModalText').textContent = text;
          document.getElementById('dayModal').classList.add('active');
        });
      }

      // 잠금 기능 클릭
      if (!isPaid) {
        var lockedItems = document.querySelectorAll('.locked-item');
        for (var l = 0; l < lockedItems.length; l++) {
          lockedItems[l].addEventListener('click', function() {
            document.getElementById('premiumModal').classList.add('active');
          });
        }
      }

      // 개발자 버튼 텍스트
      var devBtn = document.getElementById('devUnlockBtn');
      devBtn.textContent = isPaid ? '무료로 되돌리기' : '유료 전환 테스트';
      
      // 링크 복사
      document.getElementById('copyLinkBtn').addEventListener('click', function() {
        var url = window.location.href;
        navigator.clipboard.writeText(url).then(function() {
          var btn = document.getElementById('copyLinkBtn');
          btn.innerHTML = '<i class="fa-solid fa-check"></i> 복사 완료!';
          btn.style.background = '#dcfce7';
          btn.style.color = 'var(--good)';
          btn.style.borderColor = 'var(--good)';
          setTimeout(function() {
            btn.innerHTML = '<i class="fa-solid fa-link"></i> 링크 복사하기';
            btn.style.background = 'var(--bg)';
            btn.style.color = 'var(--text)';
            btn.style.borderColor = 'var(--border)';
          }, 2000);
        }).catch(function() {
          alert('링크 복사에 실패했어요.\n수동으로 주소를 복사해주세요.');
        });
      });
    }

    // 모달 이벤트
    document.getElementById('dayModalClose').addEventListener('click', function() {
      document.getElementById('dayModal').classList.remove('active');
    });

    document.getElementById('dayModal').addEventListener('click', function(e) {
      if (e.target.id === 'dayModal') {
        document.getElementById('dayModal').classList.remove('active');
      }
    });

    document.getElementById('closePremiumModal').addEventListener('click', function() {
      document.getElementById('premiumModal').classList.remove('active');
    });

    document.getElementById('premiumModal').addEventListener('click', function(e) {
      if (e.target.id === 'premiumModal') {
        document.getElementById('premiumModal').classList.remove('active');
      }
    });

    document.getElementById('requestSubscribeBtn').addEventListener('click', function() {
      alert('부모님께 구독 요청 메시지를 보냈어요.\n(기능 준비 중)');
      document.getElementById('premiumModal').classList.remove('active');
    });

    document.getElementById('closeMemoHistory').addEventListener('click', function() {
      document.getElementById('memoHistoryModal').classList.remove('active');
    });

    document.getElementById('memoHistoryModal').addEventListener('click', function(e) {
      if (e.target.id === 'memoHistoryModal') {
        document.getElementById('memoHistoryModal').classList.remove('active');
      }
    });

    document.getElementById('memoCancel').addEventListener('click', function() {
      document.getElementById('memoModal').classList.remove('active');
    });

    document.getElementById('memoModal').addEventListener('click', function(e) {
      if (e.target.id === 'memoModal') {
        document.getElementById('memoModal').classList.remove('active');
      }
    });

    document.getElementById('memoSave').addEventListener('click', function() {
      var token = getTokenFromUrl();
      var text = document.getElementById('memoText').value.trim();
      if (text) {
        saveMemo(token, text);
      }
      document.getElementById('memoModal').classList.remove('active');
      renderGuardianView();
    });

    document.getElementById('devUnlockBtn').onclick = function() {
      var currentToken = getTokenFromUrl();
      if (!currentToken) {
        alert('토큰이 URL에 없습니다.');
        return;
      }
      
      var tokens = loadGuardianTokens();
      if (!tokens[currentToken]) {
        alert('토큰이 localStorage에 없습니다.\n부모 앱에서 공유 링크를 먼저 생성해주세요.');
        return;
      }
      
      var currentPaid = isGuardianTokenPaid(currentToken);
      var newPaid = !currentPaid;
      
      tokens[currentToken].isPaid = newPaid;
      tokens[currentToken].paidAt = newPaid ? Date.now() : null;
      localStorage.setItem(GUARDIAN_TOKENS_KEY, JSON.stringify(tokens));
      
      selectedWeekOffset = 0; // 주 선택 초기화
      alert('상태 변경: ' + (currentPaid ? '유료' : '무료') + ' -> ' + (newPaid ? '유료' : '무료'));
      renderGuardianView();
    };

    // 초기 렌더링
    renderGuardianView();
  </script>
</body>

</html>
